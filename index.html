<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Biscuit — Crumb Control</title>
  <style>
    :root {
      --cream: #f5dfb8;
      --cream-2: #edd09e;
      --rose: #b85d58;
      --rose-soft: #cf7d74;
      --brown: #6c3e1f;
      --brown-dark: #3f2716;
      --brown-mid: #8f5b2d;
      --shadow: rgba(39, 23, 12, 0.48);

      --character-x: 64%;
      --character-bottom: 6.2%;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #171007;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    button, input { font: inherit; }

    .scene {
      position: relative;
      width: min(100vw, 1586px);
      aspect-ratio: 1586 / 992;
      overflow: hidden;
      isolation: isolate;
      background: #2c1d0e;
      user-select: none;
    }

    .backroom {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      pointer-events: none;
    }

    .scene::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      box-shadow: inset 0 0 5vw rgba(24, 13, 6, .18);
    }

    .sprite {
      position: absolute;
      left: var(--character-x);
      bottom: var(--character-bottom);
      transform: translateX(-50%);
      transform-origin: 50% 100%;
      height: 50%;
      width: auto;
      z-index: 8;
      image-rendering: auto;
      pointer-events: none;
      filter: drop-shadow(0 .45vw .25vw rgba(48, 25, 10, .20));
    }

    .sprite.clickable {
      pointer-events: auto;
      cursor: pointer;
      transition: transform 160ms ease, filter 160ms ease;
    }

    .sprite.clickable:hover {
      transform: translateX(-50%) translateY(-.35%) scale(1.012);
      filter: drop-shadow(0 .5vw .35vw rgba(48, 25, 10, .30));
    }

    .sprite.back  { height: 46.8%; left: 61%; bottom: 6.6%; }
    .sprite.turn  { height: 48.4%; left: 63.0%; bottom: 6.2%; }
    .sprite.front { height: 48.4%; left: 63.5%; bottom: 5.8%; }
    .sprite.done  { height: 49.6%; left: 62.8%; bottom: 5.5%; }

    /* Reduced swipe sprites so Biscuit stays grounded on the visible floor. */
    .sprite.swipe-right  { height: 50%; left: 55.5%; bottom: 0.0%; z-index: 11; }
    .sprite.swipe-center { height: 52%; left: 51.2%; bottom: -0.3%; z-index: 11; }
    .sprite.swipe-left   { height: 50%; left: 46.5%; bottom: 0.0%; z-index: 11; }

    .dialogue {
      position: absolute;
      left: 7.2%;
      top: 31.5%;
      width: 45%;
      height: auto;
      z-index: 12;
      pointer-events: none;
      opacity: 0;
      transform: translateY(1.2%) scale(.985);
    }

    .dialogue.crumb-control {
      width: 45%;
      top: 29.2%;
      left: 6.4%;
    }

    .dialogue.tidy {
      width: 45%;
      top: 31.3%;
      left: 7.2%;
    }

    .show-pop {
      animation: popIn 340ms cubic-bezier(.18,.82,.24,1) forwards;
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(1.5%) scale(.975); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .input-wrap {
      position: absolute;
      left: 10.7%;
      top: 54.6%;
      width: 36.5%;
      z-index: 13;
      opacity: 0;
      transform: translateY(5%);
      pointer-events: none;
    }

    .input-wrap.visible {
      animation: uiIn 380ms ease forwards;
      pointer-events: auto;
    }

    @keyframes uiIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .crumb-input {
      width: 100%;
      height: clamp(38px, 5vw, 68px);
      border: clamp(2px, .28vw, 5px) solid var(--brown);
      outline: clamp(2px, .16vw, 3px) solid #bc8b50;
      outline-offset: calc(clamp(2px, .16vw, 3px) * -2);
      border-radius: 3px;
      padding: 0 clamp(12px, 1.5vw, 24px);
      background:
        linear-gradient(rgba(255,255,255,.12), rgba(255,255,255,0)),
        #f2d8aa;
      color: var(--brown-dark);
      box-shadow:
        0 .35vw 0 rgba(76, 43, 20, .40),
        inset 0 0 0 clamp(2px, .15vw, 3px) rgba(248, 226, 185, .58);
      font-size: clamp(10px, 1.22vw, 20px);
      font-weight: 700;
      letter-spacing: .015em;
      caret-color: var(--rose);
      user-select: text;
    }

    .crumb-input::placeholder {
      color: #a66e5d;
      opacity: .86;
      font-style: italic;
      font-weight: 600;
    }

    .crumb-input:focus {
      border-color: #7c4926;
      box-shadow:
        0 .38vw 0 rgba(76,43,20,.44),
        inset 0 0 0 clamp(2px, .15vw, 3px) rgba(255,235,197,.76),
        0 0 0 clamp(2px, .16vw, 3px) rgba(220,137,119,.32);
    }

    .input-wrap.nudge { animation: nudge 260ms ease; }

    @keyframes nudge {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-1.2%); }
      75% { transform: translateX(1.2%); }
    }

    .sweep-button {
      appearance: none;
      position: absolute;
      left: 11.6%;
      top: 67.8%;
      width: 34.5%;
      border: 0;
      padding: 0;
      margin: 0;
      background: transparent;
      z-index: 14;
      cursor: pointer;
      opacity: 0;
      transform: translateY(4%) scale(.99);
      pointer-events: none;
      filter: drop-shadow(0 .35vw .2vw rgba(49, 29, 13, .22));
    }

    .sweep-button.visible {
      animation: buttonIn 430ms 90ms ease forwards;
      pointer-events: auto;
    }

    .sweep-button img { display: block; width: 100%; height: auto; }

    .sweep-button:hover {
      filter: brightness(1.035) drop-shadow(0 .45vw .22vw rgba(49,29,13,.30));
    }

    .sweep-button:active {
      transform: translateY(.5%) scale(.985);
    }

    .sweep-button:focus-visible {
      outline: 3px solid rgba(255, 232, 190, .88);
      outline-offset: 5px;
    }

    @keyframes buttonIn {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* The typed thought appears on the rug, behind the foreground broom. */
    .floor-thought {
      position: absolute;
      left: 50%;
      top: 86.5%;
      width: 46%;
      transform: translateX(-50%);
      z-index: 9;
      text-align: center;
      color: #f7dfb7;
      font-size: clamp(15px, 2.025vw, 33px);
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: .025em;
      text-shadow:
        -1px -1px 0 #6b3e23,
         1px -1px 0 #6b3e23,
        -1px  1px 0 #6b3e23,
         1px  1px 0 #6b3e23,
         0 .18vw .18vw rgba(45,25,12,.55);
      pointer-events: none;
      opacity: 0;
    }

    .floor-thought.visible {
      animation: thoughtIn 260ms ease forwards;
    }

    @keyframes thoughtIn {
      from { opacity: 0; transform: translateX(-50%) translateY(10%); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    .crumb-char {
      display: inline-block;
      white-space: pre;
      will-change: transform, opacity, filter;
    }

    .crumb-char.crumbling {
      animation: crumbleAway 760ms cubic-bezier(.19,.8,.28,1) forwards;
      animation-delay: var(--delay, 0ms);
    }

    @keyframes crumbleAway {
      0%   { opacity: 1; transform: translate(0,0) scale(1) rotate(0deg); filter: blur(0); }
      38%  { opacity: .95; transform: translate(-8px, 4px) scale(.82) rotate(-3deg); }
      66%  { opacity: .72; transform: translate(-22px, 11px) scale(.42) rotate(5deg); filter: blur(.2px); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.10) rotate(var(--rot)); filter: blur(.6px); }
    }

    .particle-layer {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      overflow: hidden;
    }

    .pixel-crumb {
      position: absolute;
      width: clamp(3px, .36vw, 7px);
      aspect-ratio: 1;
      background: #d99a52;
      box-shadow: .22vw .12vw 0 #7b4a25;
      opacity: 0;
      transform: translate(-50%, -50%);
      animation: pixelSweep 820ms ease-out forwards;
      animation-delay: var(--delay);
    }

    @keyframes pixelSweep {
      0%   { opacity: 0; transform: translate(-50%,-50%) scale(.4); }
      18%  { opacity: 1; transform: translate(-50%,-50%) scale(1); }
      100% { opacity: 0; transform: translate(calc(-50% + var(--px)), calc(-50% + var(--py))) scale(.35); }
    }

    .fade-out {
      animation: fadeOut 220ms ease forwards !important;
      pointer-events: none !important;
    }

    @keyframes fadeOut {
      to { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 1ms !important;
        animation-delay: 0ms !important;
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="scene" id="scene" aria-label="Willowpaw Café back room">
    <img class="backroom" src="back-room.png" alt="" />

    <img
      id="biscuit"
      class="sprite back clickable"
      src="Biscuit-idle.png"
      alt="Biscuit sweeping in the café back room"
      draggable="false"
      tabindex="0"
      role="button"
      aria-label="Biscuit"
    />

    <img id="dialogue" class="dialogue" src="text-found-me.png" alt="" draggable="false" />

    <div class="input-wrap" id="inputWrap">
      <input
        id="crumbInput"
        class="crumb-input"
        type="text"
        maxlength="90"
        autocomplete="off"
        spellcheck="true"
        placeholder="whatever's rattling in your mind..."
        aria-label="Mental crumbs"
      />
    </div>

    <button id="sweepButton" class="sweep-button" type="button" aria-label="Sweep them away, Biscuit!">
      <img src="button.png" alt="Sweep them away, Biscuit!" draggable="false" />
    </button>

    <div id="floorThought" class="floor-thought" aria-live="polite"></div>
    <div id="particleLayer" class="particle-layer" aria-hidden="true"></div>
  </main>

  <script>
    (() => {
      const ASSETS = {
        back: 'Biscuit-idle.png',
        turn: 'Biscuit-turn.png',
        front: 'Biscuit-front.png',
        swipeRight: 'Biscuit-swipe-right.png',
        swipeCenter: 'Biscuit-swipe-center.png',
        swipeLeft: 'Biscuit-swipe-left.png',
        done: 'Biscuit-done.png',
        found: 'text-found-me.png',
        crumbControl: 'text-crumb-control-new.png',
        tidy: 'text-tidy.png'
      };

      const TIMING = {
        foundMessage: 1600,
        crumbIntroBeforeInput: 900,
        thoughtPause: 520,
        swipeFrame: 390,
        afterSwipe: 320,
        tidyBeforeReset: 3000
      };

      const biscuit = document.getElementById('biscuit');
      const dialogue = document.getElementById('dialogue');
      const inputWrap = document.getElementById('inputWrap');
      const crumbInput = document.getElementById('crumbInput');
      const sweepButton = document.getElementById('sweepButton');
      const floorThought = document.getElementById('floorThought');
      const particleLayer = document.getElementById('particleLayer');

      let phase = 'hidden';
      let timers = [];

      Object.values(ASSETS).forEach(src => {
        const img = new Image();
        img.src = src;
      });

      new Image().src = 'button.png';
      new Image().src = 'back-room.png';

      const later = (fn, ms) => {
        const id = window.setTimeout(fn, ms);
        timers.push(id);
        return id;
      };

      const setSprite = (name, className) => {
        biscuit.src = ASSETS[name];
        biscuit.className = `sprite ${className}`;
        biscuit.removeAttribute('tabindex');
        biscuit.removeAttribute('role');
      };

      const showDialogue = (name, extraClass = '') => {
        dialogue.className = `dialogue ${extraClass}`.trim();
        dialogue.src = ASSETS[name];
        void dialogue.offsetWidth;
        dialogue.classList.add('show-pop');
      };

      const hideDialogue = () => dialogue.classList.add('fade-out');

      function resetScene() {
        timers.forEach(id => window.clearTimeout(id));
        timers = [];
        phase = 'hidden';

        biscuit.src = ASSETS.back;
        biscuit.className = 'sprite back clickable';
        biscuit.setAttribute('tabindex', '0');
        biscuit.setAttribute('role', 'button');
        biscuit.setAttribute('aria-label', 'Biscuit');

        dialogue.src = ASSETS.found;
        dialogue.className = 'dialogue';

        inputWrap.className = 'input-wrap';
        sweepButton.className = 'sweep-button';
        crumbInput.value = '';

        floorThought.className = 'floor-thought';
        floorThought.innerHTML = '';

        particleLayer.className = 'particle-layer';
        particleLayer.innerHTML = '';
      }

      function meetBiscuit() {
        if (phase !== 'hidden') return;
        phase = 'found';

        setSprite('turn', 'turn');
        showDialogue('found');

        later(() => {
          phase = 'intro';
          setSprite('front', 'front');
          showDialogue('crumbControl', 'crumb-control');

          later(() => {
            phase = 'ready';
            inputWrap.classList.add('visible');
            sweepButton.classList.add('visible');
            later(() => crumbInput.focus({ preventScroll: true }), 220);
          }, TIMING.crumbIntroBeforeInput);
        }, TIMING.foundMessage);
      }

      function renderThought(text) {
        floorThought.innerHTML = '';

        [...text].forEach((char, index) => {
          const span = document.createElement('span');
          span.className = 'crumb-char';
          span.textContent = char;
          span.dataset.index = index;
          floorThought.appendChild(span);
        });

        floorThought.className = 'floor-thought visible';
      }

      function makePixelCrumbs() {
        const sceneRect = document.getElementById('scene').getBoundingClientRect();
        const thoughtRect = floorThought.getBoundingClientRect();

        const centerX =
          ((thoughtRect.left + thoughtRect.width / 2) - sceneRect.left) /
          sceneRect.width * 100;

        const centerY =
          ((thoughtRect.top + thoughtRect.height / 2) - sceneRect.top) /
          sceneRect.height * 100;

        particleLayer.innerHTML = '';

        const count = Math.min(
          28,
          Math.max(14, Math.floor(floorThought.textContent.length / 2.3))
        );

        for (let i = 0; i < count; i++) {
          const p = document.createElement('i');
          p.className = 'pixel-crumb';

          p.style.left = `${centerX + (Math.random() - .5) * 20}%`;
          p.style.top = `${centerY + (Math.random() - .5) * 3}%`;
          p.style.setProperty('--px', `${(-45 - Math.random() * 55)}px`);
          p.style.setProperty('--py', `${(8 + Math.random() * 34)}px`);
          p.style.setProperty('--delay', `${Math.random() * 220}ms`);

          if (Math.random() > .55) {
            p.style.background = '#efc27e';
          }

          particleLayer.appendChild(p);
        }
      }

      function crumbleText() {
        const chars = floorThought.querySelectorAll('.crumb-char');

        chars.forEach((span, i) => {
          const intensity = 18 + Math.random() * 42;

          span.style.setProperty('--dx', `${-(intensity + i * .35)}px`);
          span.style.setProperty('--dy', `${8 + Math.random() * 26}px`);
          span.style.setProperty('--rot', `${-35 + Math.random() * 70}deg`);
          span.style.setProperty('--delay', `${Math.random() * 180}ms`);
          span.classList.add('crumbling');
        });

        makePixelCrumbs();
      }

      function beginSweep() {
        if (phase !== 'ready') return;

        const value = crumbInput.value.trim();

        if (!value) {
          inputWrap.classList.remove('nudge');
          void inputWrap.offsetWidth;
          inputWrap.classList.add('nudge');
          crumbInput.focus();
          return;
        }

        phase = 'sweeping';

        crumbInput.blur();
        inputWrap.classList.add('fade-out');
        sweepButton.classList.add('fade-out');
        hideDialogue();

        renderThought(value);
        crumbInput.value = '';

        later(() => {
          setSprite('swipeRight', 'swipe-right');

          later(() => {
            setSprite('swipeCenter', 'swipe-center');
            crumbleText();

            later(() => {
              setSprite('swipeLeft', 'swipe-left');

              later(() => {
                phase = 'tidy';

                floorThought.classList.add('fade-out');
                particleLayer.classList.add('fade-out');

                setSprite('done', 'done');
                showDialogue('tidy', 'tidy');

                window.setTimeout(() => {
                  resetScene();
                }, TIMING.tidyBeforeReset);

              }, TIMING.swipeFrame + TIMING.afterSwipe);

            }, TIMING.swipeFrame);

          }, TIMING.swipeFrame);

        }, TIMING.thoughtPause);
      }

      biscuit.addEventListener('click', meetBiscuit);

      biscuit.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          meetBiscuit();
        }
      });

      sweepButton.addEventListener('click', beginSweep);

      crumbInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          beginSweep();
        }
      });
    })();
  </script>
</body>
</html>
